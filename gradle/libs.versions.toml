fragmentKtx = "1.8.5"
constraintlayout = "2.2.2"
leanback = "1.2.0"
cardview = "1.0.0"
lifecycleKtx = "2.9.4"
coroutines = "1.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
